<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBS启动会签到看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 15px 20px;
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 38px;
            font-weight: bold;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .header .subtitle {
            font-size: 18px;
            opacity: 0.7;
            color: #aaa;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .qr-section {
            background: rgba(255,255,255,0.95);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .qr-section h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .qr-code {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stats-bar {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 12px 30px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .stat-box .number {
            font-size: 42px;
            font-weight: bold;
            line-height: 1.2;
        }
        
        .stat-box .label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .stat-box.checked .number { color: #4ade80; }
        .stat-box.unchecked .number { color: #f87171; }
        .stat-box.total .number { color: #fbbf24; }
        
        .table-container {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .checkin-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1400px;
        }
        
        .checkin-table th,
        .checkin-table td {
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            min-width: 100px;
        }
        
        .checkin-table thead th {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .checkin-table thead th:first-child {
            background: rgba(255, 215, 0, 0.3);
            position: sticky;
            left: 0;
            z-index: 20;
            min-width: 120px;
        }
        
        .checkin-table tbody th {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            padding-left: 15px;
            position: sticky;
            left: 0;
            z-index: 5;
            min-width: 120px;
        }
        
        .checkin-table td {
            font-size: 14px;
        }
        
        .cell-checked {
            background: rgba(74, 222, 128, 0.25);
            color: #4ade80;
            font-weight: bold;
        }
        
        .cell-unchecked {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        
        .cell-empty {
            background: rgba(100, 100, 100, 0.2);
            color: #666;
        }
        
        .cell-name {
            display: block;
            font-size: 14px;
        }
        
        .cell-time {
            display: block;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        
        .dept-total {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 3px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }
        
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(248, 113, 113, 0.4);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(74, 222, 128, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            color: #333;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .modal-content input:focus {
            outline: none;
            border-color: #0f3460;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 25px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal-btn.confirm {
            background: #22c55e;
            color: white;
        }
        
        .modal-btn.cancel {
            background: #ef4444;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MBS启动会签到看板</h1>
        <div class="subtitle" id="currentTime"></div>
    </div>
    
    <div class="top-bar">
        <div class="qr-section">
            <h3>扫码签到</h3>
            <div class="qr-code" id="qrCode">加载中...</div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-box checked">
                <div class="number" id="checkedCount">0</div>
                <div class="label">已签到</div>
            </div>
            <div class="stat-box unchecked">
                <div class="number" id="uncheckedCount">0</div>
                <div class="label">未签到</div>
            </div>
            <div class="stat-box total">
                <div class="number" id="totalCount">0</div>
                <div class="label">总人数</div>
            </div>
        </div>
        
        <div class="qr-section">
            <h3>扫码签到</h3>
            <div class="qr-code" id="qrCode2">加载中...</div>
        </div>
    </div>
    
    <div class="table-container" id="tableContainer">
        <div class="loading">加载中...</div>
    </div>
    
    <div class="controls">
        <button class="btn btn-refresh" onclick="refreshData()"> 刷新数据</button>
        <button class="btn btn-add" onclick="showAddModal()"> 补录签到</button>
    </div>
    
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>补录签到</h2>
            <input type="text" id="addNameInput" placeholder="输入姓名">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeAddModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmAdd()">确认补录</button>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://jtcoqlpxdubcmdpawyiu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g9LTQJUkOYi2F0AU8wmPbw_Gb-kxdI_';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allStaff = [];
        let checkinRecords = [];
        
        // 部门顺序（横轴）
        const deptOrder = ['总装分厂', '电子分厂', '电机分厂', '注塑分厂', '部品分厂', '计划物流部', '工程部', 'HRBP', '苏州品质', '财务部'];
        
        // 职位顺序（纵轴）
        const posOrder = ['厂长', '综合主管', '工艺主管', '设备主管', '生产主管', '品质', 'IE', '成本', '计划'];
        
        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            await loadQRCode();
            await loadData();
            setInterval(loadData, 5000);
        }
        
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeStr;
        }
        
        async function loadQRCode() {
            const checkinUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'checkin.html');
            const qrHtml = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(checkinUrl)}" style="width:100%;height:100%;">`;
            document.getElementById('qrCode').innerHTML = qrHtml;
            document.getElementById('qrCode2').innerHTML = qrHtml;
        }
        
        async function loadData() {
            try {
                const { data: staffData, error: staffError } = await db
                    .from('checkin_staff')
                    .select('*');
                
                if (staffError) throw staffError;
                allStaff = staffData;
                
                const { data: recordsData, error: recordsError } = await db
                    .from('checkin_records')
                    .select('*')
                    .order('checkin_time');
                
                if (recordsError) throw recordsError;
                checkinRecords = recordsData || [];
                
                renderTable();
                updateStats();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('tableContainer').innerHTML = 
                    '<div class="loading">加载失败，请刷新重试</div>';
            }
        }
        
        function renderTable() {
            const container = document.getElementById('tableContainer');
            
            // 按部门和职位建立索引
            const staffMap = {};
            allStaff.forEach(staff => {
                const key = `${staff.department}|${staff.position}`;
                if (!staffMap[key]) staffMap[key] = [];
                staffMap[key].push(staff);
            });
            
            // 表头：横轴是职位
            let html = '<table class="checkin-table"><thead><tr>';
            html += '<th>分厂/部门</th>';
            posOrder.forEach(pos => {
                const posStaff = allStaff.filter(s => s.position === pos);
                const checkedCount = posStaff.filter(s => checkinRecords.some(r => r.staff_id === s.id)).length;
                html += `<th>${pos}<div class="dept-total">${checkedCount}/${posStaff.length}</div></th>`;
            });
            html += '</tr></thead><tbody>';
            
            // 每行一个分厂（纵轴）
            deptOrder.forEach(dept => {
                const deptStaff = allStaff.filter(s => s.department === dept);
                const deptChecked = deptStaff.filter(s => checkinRecords.some(r => r.staff_id === s.id)).length;
                html += `<tr><th>${dept}<div class="dept-total">${deptChecked}/${deptStaff.length}</div></th>`;
                posOrder.forEach(position => {
                    const key = `${dept}|${position}`;
                    const staffs = staffMap[key] || [];
                    
                    if (staffs.length === 0) {
                        html += '<td class="cell-empty">-</td>';
                    } else {
                        const cellContent = staffs.map(staff => {
                            const record = checkinRecords.find(r => r.staff_id === staff.id);
                            const isChecked = !!record;
                            const time = record ? new Date(record.checkin_time).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) : '';
                            
                            if (isChecked) {
                                return `<span class="cell-name">${staff.name}<span class="cell-time">${time}</span></span>`;
                            } else {
                                return `<span class="cell-name">${staff.name}</span>`;
                            }
                        }).join('');
                        
                        const allChecked = staffs.every(s => checkinRecords.some(r => r.staff_id === s.id));
                        const cellClass = allChecked ? 'cell-checked' : (staffs.some(s => checkinRecords.some(r => r.staff_id === s.id)) ? '' : 'cell-unchecked');
                        
                        html += `<td class="${cellClass}">${cellContent}</td>`;
                    }
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function updateStats() {
            const total = allStaff.length;
            const checked = checkinRecords.length;
            const unchecked = total - checked;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('checkedCount').textContent = checked;
            document.getElementById('uncheckedCount').textContent = unchecked;
        }
        
        async function refreshData() {
            if (confirm('确定要清空所有签到数据吗？')) {
                try {
                    const { error } = await db
                        .from('checkin_records')
                        .delete()
                        .neq('id', '00000000-0000-0000-0000-000000000000');
                    
                    if (error) throw error;
                    
                    checkinRecords = [];
                    renderTable();
                    updateStats();
                    alert('签到数据已清空！');
                } catch (error) {
                    console.error('刷新失败:', error);
                    alert('刷新失败，请重试');
                }
            }
        }
        
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addNameInput').value = '';
            document.getElementById('addNameInput').focus();
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }
        
        async function confirmAdd() {
            const name = document.getElementById('addNameInput').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            const staff = allStaff.find(s => s.name === name);
            if (!staff) {
                alert('未找到该人员，请检查姓名是否正确');
                return;
            }
            
            if (checkinRecords.some(r => r.staff_id === staff.id)) {
                alert('该人员已签到');
                return;
            }
            
            try {
                const { error } = await db
                    .from('checkin_records')
                    .insert([{
                        staff_id: staff.id,
                        device_id: 'manual-' + Date.now()
                    }]);
                
                if (error) throw error;
                
                closeAddModal();
                await loadData();
                alert('补录成功！');
            } catch (error) {
                console.error('补录失败:', error);
                alert('补录失败，请重试');
            }
        }
        
        init();
    </script>
</body>
</html>
