<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBS启动会签到看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-size: 24px;
            opacity: 0.9;
        }
        
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .qr-section {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .qr-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .qr-code {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        
        .stats-section {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: center;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.15);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .stat-box .number {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-box .label {
            font-size: 20px;
            opacity: 0.9;
        }
        
        .stat-box.checked .number {
            color: #4ade80;
        }
        
        .stat-box.unchecked .number {
            color: #f87171;
        }
        
        .stat-box.total .number {
            color: #fbbf24;
        }
        
        .board-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        .department {
            margin-bottom: 25px;
        }
        
        .department:last-child {
            margin-bottom: 0;
        }
        
        .department-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        
        .department-name {
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
        }
        
        .department-stats {
            font-size: 18px;
            opacity: 0.8;
        }
        
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        
        .staff-card {
            background: rgba(255,255,255,0.15);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .staff-card.checked {
            background: rgba(74, 222, 128, 0.25);
            border-color: #4ade80;
        }
        
        .staff-card.unchecked {
            background: rgba(248, 113, 113, 0.25);
            border-color: #f87171;
        }
        
        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .staff-card.checked .status-dot {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }
        
        .staff-card.unchecked .status-dot {
            background: #f87171;
        }
        
        .staff-info {
            flex: 1;
        }
        
        .staff-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .staff-position {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .checkin-time {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }
        
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(248, 113, 113, 0.4);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* 补录弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: #333;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #1e3c72;
        }
        
        .modal-content input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .modal-content input:focus {
            outline: none;
            border-color: #2a5298;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal-btn.confirm {
            background: #22c55e;
            color: white;
        }
        
        .modal-btn.cancel {
            background: #ef4444;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            
            .top-section {
                flex-direction: column;
            }
            
            .staff-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MBS启动会签到看板</h1>
        <div class="subtitle" id="currentTime"></div>
    </div>
    
    <div class="top-section">
        <div class="qr-section">
            <h3>扫码签到</h3>
            <div class="qr-code" id="qrCode">
                二维码加载中...
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stat-box checked">
                <div class="number" id="checkedCount">0</div>
                <div class="label">已签到</div>
            </div>
            <div class="stat-box unchecked">
                <div class="number" id="uncheckedCount">0</div>
                <div class="label">未签到</div>
            </div>
            <div class="stat-box total">
                <div class="number" id="totalCount">0</div>
                <div class="label">总人数</div>
            </div>
        </div>
        
        <div class="qr-section">
            <h3>扫码签到</h3>
            <div class="qr-code" id="qrCode2">
                二维码加载中...
            </div>
        </div>
    </div>
    
    <div class="board-container" id="boardContainer">
        <div class="loading">加载中...</div>
    </div>
    
    <div class="controls">
        <button class="btn btn-refresh" onclick="refreshData()"> 刷新数据</button>
        <button class="btn btn-add" onclick="showAddModal()"> 补录签到</button>
    </div>
    
    <!-- 补录弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>补录签到</h2>
            <input type="text" id="addNameInput" placeholder="输入姓名">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeAddModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmAdd()">确认补录</button>
            </div>
        </div>
    </div>
    
    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://jtcoqlpxdubcmdpawyiu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g9LTQJUkOYi2F0AU8wmPbw_Gb-kxdI_';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allStaff = [];
        let checkinRecords = [];
        
        // 初始化
        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            
            await loadQRCode();
            await loadData();
            
            // 每 5 秒自动刷新
            setInterval(loadData, 5000);
        }
        
        // 更新时间
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeStr;
        }
        
        // 加载二维码
        async function loadQRCode() {
            const checkinUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'checkin.html');
            const qrHtml = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(checkinUrl)}" alt="签到二维码" style="width:100%;height:100%;">`;
            document.getElementById('qrCode').innerHTML = qrHtml;
            document.getElementById('qrCode2').innerHTML = qrHtml;
        }
        
        // 加载数据
        async function loadData() {
            try {
                // 加载人员清单
                const { data: staffData, error: staffError } = await db
                    .from('checkin_staff')
                    .select('*')
                    .order('department')
                    .order('position');
                
                if (staffError) throw staffError;
                allStaff = staffData;
                
                // 加载签到记录
                const { data: recordsData, error: recordsError } = await db
                    .from('checkin_records')
                    .select('*, checkin_staff(name, department, position)')
                    .order('checkin_time');
                
                if (recordsError) throw recordsError;
                checkinRecords = recordsData || [];
                
                renderBoard();
                updateStats();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('boardContainer').innerHTML = 
                    '<div class="loading">加载失败，请刷新重试</div>';
            }
        }
        
        // 渲染看板
        function renderBoard() {
            const container = document.getElementById('boardContainer');
            
            // 按部门分组
            const departments = {};
            allStaff.forEach(staff => {
                if (!departments[staff.department]) {
                    departments[staff.department] = [];
                }
                departments[staff.department].push(staff);
            });
            
            let html = '';
            for (const [dept, staffs] of Object.entries(departments)) {
                const checkedCount = staffs.filter(s => 
                    checkinRecords.some(r => r.staff_id === s.id)
                ).length;
                
                html += `
                    <div class="department">
                        <div class="department-header">
                            <div class="department-name">${dept}</div>
                            <div class="department-stats">${checkedCount}/${staffs.length} 已签到</div>
                        </div>
                        <div class="staff-grid">
                            ${staffs.map(staff => {
                                const record = checkinRecords.find(r => r.staff_id === staff.id);
                                const isChecked = !!record;
                                const checkinTime = record ? new Date(record.checkin_time).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) : '';
                                
                                return `
                                    <div class="staff-card ${isChecked ? 'checked' : 'unchecked'}">
                                        <div class="status-dot"></div>
                                        <div class="staff-info">
                                            <div class="staff-name">${staff.name}</div>
                                            <div class="staff-position">${staff.position}</div>
                                            ${checkinTime ? `<div class="checkin-time">${checkinTime} 签到</div>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        // 更新统计
        function updateStats() {
            const total = allStaff.length;
            const checked = checkinRecords.length;
            const unchecked = total - checked;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('checkedCount').textContent = checked;
            document.getElementById('uncheckedCount').textContent = unchecked;
        }
        
        // 刷新数据
        async function refreshData() {
            if (confirm('确定要清空所有签到数据吗？')) {
                try {
                    const { error } = await db
                        .from('checkin_records')
                        .delete()
                        .neq('id', '00000000-0000-0000-0000-000000000000');
                    
                    if (error) throw error;
                    
                    checkinRecords = [];
                    renderBoard();
                    updateStats();
                    
                    alert('签到数据已清空！');
                } catch (error) {
                    console.error('刷新失败:', error);
                    alert('刷新失败，请重试');
                }
            }
        }
        
        // 显示补录弹窗
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addNameInput').value = '';
            document.getElementById('addNameInput').focus();
        }
        
        // 关闭补录弹窗
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }
        
        // 确认补录
        async function confirmAdd() {
            const name = document.getElementById('addNameInput').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            // 查找该姓名的人员
            const staff = allStaff.find(s => s.name === name);
            if (!staff) {
                alert('未找到该人员，请检查姓名是否正确');
                return;
            }
            
            // 检查是否已签到
            if (checkinRecords.some(r => r.staff_id === staff.id)) {
                alert('该人员已签到');
                return;
            }
            
            try {
                const { error } = await db
                    .from('checkin_records')
                    .insert([{
                        staff_id: staff.id,
                        device_id: 'manual-' + Date.now()
                    }]);
                
                if (error) throw error;
                
                closeAddModal();
                await loadData();
                alert('补录成功！');
            } catch (error) {
                console.error('补录失败:', error);
                alert('补录失败，请重试');
            }
        }
        
        // 启动
        init();
    </script>
</body>
</html>
